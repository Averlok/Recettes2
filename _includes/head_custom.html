<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Cibler tous les titres de recettes (h2, h3)
    document.querySelectorAll("h2, h3").forEach(function(header) {
      // Ignorer le titre principal de la page s'il y en a un
      if (!header.innerText) return;

      // Créer un slug propre sans aucun accent
      const cleanSlug = header.innerText
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

      // Assigner cet ID propre au titre
      header.id = cleanSlug;

      // Créer le petit bouton de copie 🔗
      const copyBtn = document.createElement("button");
      copyBtn.innerText = " 🔗";
      copyBtn.style.background = "none";
      copyBtn.style.border = "none";
      copyBtn.style.cursor = "pointer";
      copyBtn.style.fontSize = "0.75em";
      copyBtn.title = "Copier le lien direct pour Messenger";

      copyBtn.onclick = function(e) {
        e.preventDefault();
        // Construire l'URL propre
        const cleanUrl = window.location.origin + window.location.pathname + "#" + cleanSlug;
        
        // Copier dans le presse-papier
        navigator.clipboard.writeText(cleanUrl).then(function() {
          alert("Lien copié ! Il est prêt à être collé dans Messenger.");
        });
      };

      header.appendChild(copyBtn);
    });

    // Scroller automatiquement si quelqu'un ouvre un lien propre
    if (window.location.hash) {
      const rawHash = window.location.hash.substring(1);
      const cleanHash = decodeURIComponent(rawHash)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-");

      setTimeout(function() {
        const target = document.getElementById(cleanHash);
        if (target) {
          target.scrollIntoView({ behavior: "smooth" });
        }
      }, 300);
    }
  });
</script>
