 <script>
  document.addEventListener("DOMContentLoaded", function() {
    // Fonction pour nettoyer n'importe quel texte/id d'accent
    function cleanSlug(text) {
      return decodeURIComponent(text)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9\-_]/g, "-")
        .replace(/-+/g, "-");
    }

    // 1. On nettoie les ID de tous les titres de recettes sur la page
    document.querySelectorAll("h1, h2, h3, h4").forEach(function(header) {
      if (header.id) {
        header.id = cleanSlug(header.id);
      }
    });

    // 2. On intercepte le clic sur les liens de la TOC
    document.querySelectorAll('a[href^="#"]').forEach(function(link) {
      const rawHref = link.getAttribute("href").substring(1);
      const cleanHref = cleanSlug(rawHref);

      // On met à jour le href du lien
      link.setAttribute("href", "#" + cleanHref);

      // Quand on clique sur le lien dans la TOC
      link.addEventListener("click", function(e) {
        e.preventDefault();
        
        // Mettre à jour l'URL dans la barre de navigateur SANS accent
        history.pushState(null, null, "#" + cleanHref);

        // Scroller jusqu'à la recette
        const target = document.getElementById(cleanHref);
        if (target) {
          target.scrollIntoView({ behavior: "smooth" });
        }
      });
    });
  });
</script>
