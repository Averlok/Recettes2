<script>
  document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll("h1, h2, h3, h4").forEach(function(header) {
      if (header.id) {
        header.id = header.id
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }
    });
  });
</script>
