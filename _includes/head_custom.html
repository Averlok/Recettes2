<script>
  function addCopyLinks() {
    // Cibler tous les titres h2 et h3 dans le contenu principal
    const headers = document.querySelectorAll(".main-content h2, .main-content h3, main h2, main h3, h2, h3");

    headers.forEach(function(header) {
      // Éviter d'ajouter deux fois le bouton si le script repasse
      if (header.querySelector(".messenger-copy-btn")) return;
      if (!header.innerText.trim()) return;

      // 1. Générer le slug propre sans accent
      const cleanSlug = header.innerText
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

      // Assigner le nouvel ID au titre
      header.id = cleanSlug;

      // 2. Créer le bouton 🔗
      const copyBtn = document.createElement("button");
      copyBtn.className = "messenger-copy-btn";
      copyBtn.innerHTML = " 🔗";
      copyBtn.style.background = "none";
      copyBtn.style.border = "none";
      copyBtn.style.cursor = "pointer";
      copyBtn.style.fontSize = "0.7em";
      copyBtn.title = "Copier le lien sans accent pour Messenger";

      copyBtn.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();

        const cleanUrl = window.location.origin + window.location.pathname + "#" + cleanSlug;

        navigator.clipboard.writeText(cleanUrl).then(function() {
          alert("Lien propre copié ! Prêt à être collé dans Messenger.");
        }).catch(function() {
          // Fallback si la permission est bloquée
          prompt("Copie ce lien :", cleanUrl);
        });
      };

      header.appendChild(copyBtn);
    });
  }

  // Lancer au chargement de la page
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", addCopyLinks);
  } else {
    addCopyLinks();
  }

  // Relancer légèrement après pour contrecarrer les scripts du thème
  setTimeout(addCopyLinks, 1000);
</script>
