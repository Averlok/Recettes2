 <script>
  document.addEventListener("DOMContentLoaded", function() {
    // Fonction pour virer complètement les accents et caractères spéciaux
    function removeAccents(str) {
      return str
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "") // Enlève les tildes/accents (ex: â -> a)
        .toLowerCase()
        .replace(/[^a-z0-9\-_]/g, "-")   // Remplace tout le reste non-ASCII par des tirets
        .replace(/-+/g, "-");            // Évite les tirets doubles
    }

    // 1. Nettoyer les ID des titres h1-h4
    document.querySelectorAll("h1, h2, h3, h4").forEach(function(header) {
      if (header.id) {
        header.id = removeAccents(decodeURIComponent(header.id));
      }
    });

    // 2. Nettoyer les liens de la TOC
    document.querySelectorAll('a[href^="#"]').forEach(function(link) {
      const href = link.getAttribute("href");
      if (href && href.length > 1) {
        try {
          const rawAnchor = href.substring(1);
          const cleanAnchor = removeAccents(decodeURIComponent(rawAnchor));
          link.setAttribute("href", "#" + cleanAnchor);
        } catch(e) {}
      }
    });
  });
</script>
